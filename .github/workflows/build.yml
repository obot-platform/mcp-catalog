name: Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout Obot validator
        uses: actions/checkout@v6
        with:
          repository: obot-platform/obot
          ref: main
          path: .obot

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: false

      - name: Test Claude directory intake
        run: go -C scripts/claude-directory test ./...

      - name: Vet Claude directory intake
        run: go -C scripts/claude-directory vet ./...

      - name: Validate Claude directory review ledger
        run: go -C scripts/claude-directory run . ledger check

      - name: Validate catalog YAML
        run: go -C .obot run . mcp validate-catalog-yaml --require-entry-key "$GITHUB_WORKSPACE"
