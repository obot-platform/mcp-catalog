name: DigitalOcean (Official Remote)
entryKey: digitalocean-official
serverUserType: singleUser
shortDescription: Connect to an official DigitalOcean service with OAuth
description: |
  Connect directly to DigitalOcean's vendor-hosted MCP services. Select one service for this connection, then add another instance to access additional services.

  Authentication uses DigitalOcean OAuth. An Obot administrator must first register a DigitalOcean OAuth application and configure its client ID and secret for this catalog entry. Use `https://<obot-host>/oauth/mcp/callback` as the application's callback URL.

  ## Services

  Choose App Platform, Droplets, Kubernetes, Databases, Networking, Storage, AI Platform, Documentation, or another supported DigitalOcean service.

  ## Replacement

  This is the official remote replacement for the deprecated containerized DigitalOcean entry. The older entry remains available during the one-month observation period.
metadata:
  categories: Cloud & Infrastructure, Developer Tools
  allow-multiple: "true"
icon: https://cdn.brandfetch.io/idvF37rNoN/theme/dark/symbol.svg?c=1dxbfHSJFAPEGdCLU4o5B
repoURL: https://github.com/digitalocean-labs/mcp-digitalocean
runtime: remote
env:
- name: DigitalOcean Service
  key: DIGITALOCEAN_SERVICE
  description: Choose the DigitalOcean service to connect
  required: true
  sensitive: false
  options:
  - name: App Platform
    value: apps
    description: Deploy, manage, and monitor App Platform applications.
  - name: Account
    value: accounts
    description: Access account details, billing, invoices, and SSH keys.
  - name: Databases
    value: databases
    description: Manage DigitalOcean managed database clusters.
  - name: Kubernetes
    value: doks
    description: Manage DigitalOcean Kubernetes clusters and node pools.
  - name: Droplets
    value: droplets
    description: Create and manage DigitalOcean virtual machines.
  - name: Container Registry
    value: docr
    description: Manage container registries, repositories, and garbage collection.
  - name: Functions
    value: functions
    description: Manage serverless function namespaces, actions, and triggers.
  - name: Insights
    value: insights
    description: Manage uptime checks, alert policies, and resource metrics.
  - name: Marketplace
    value: marketplace
    description: Discover and deploy DigitalOcean Marketplace applications.
  - name: Networking
    value: networking
    description: Manage DNS, firewalls, load balancers, IPs, and VPCs.
  - name: Spaces
    value: spaces
    description: Manage Spaces access keys and CDN settings.
  - name: Volumes
    value: volumes
    description: Manage block storage volumes and snapshots.
  - name: Network File Storage
    value: nfs
    description: Manage network file shares, snapshots, and access rules.
  - name: Documentation
    value: docs
    description: Search and retrieve DigitalOcean documentation.
  - name: Dedicated Inference
    value: dedicated-inference
    description: Manage GPU-accelerated dedicated inference endpoints.
  - name: Model Catalog
    value: inference-modelcatalog
    description: Browse and retrieve DigitalOcean AI model details.
  - name: Batch Inference
    value: genai-batchinference
    description: Create and monitor asynchronous AI batch inference jobs.
  - name: Custom Models
    value: genai-custom-models
    description: Manage bring-your-own models on DigitalOcean AI Platform.
  - name: Inference Router
    value: genai-inferencerouter
    description: Manage named GenAI model-routing configurations.
  - name: AI Evaluations
    value: genai-evaluation
    description: Manage datasets and evaluation workflows for AI deployments.
  - name: Vector Databases
    value: vector-databases
    description: Manage DigitalOcean hosted Weaviate vector database clusters.
remoteConfig:
  URLTemplate: https://${DIGITALOCEAN_SERVICE}.mcp.digitalocean.com/mcp
  staticOAuthRequired: true
toolPreview:
- name: apps-list
  description: List App Platform applications.
  params: {}
- name: droplet-list
  description: List Droplets in the DigitalOcean account.
  params: {}
- name: docs-search
  description: Search DigitalOcean documentation.
  params:
    query: Search query.
