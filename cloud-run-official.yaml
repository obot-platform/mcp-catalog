name: Google Cloud Run (Official)
entryKey: google-cloud-run
serverUserType: singleUser
shortDescription: Inspect and deploy Cloud Run services through Google's managed MCP server
description: |
  Connect to Google's managed Cloud Run MCP server to list and inspect services or deploy applications from container images, source archives, and inline source files.

  ## What you'll need to connect

  Ask your Google Cloud administrator to:

  1. Select or create a billing-enabled Google Cloud project and enable the [Cloud Run Admin API](https://console.cloud.google.com/apis/enableflow?apiid=run.googleapis.com).
  2. Grant your Google identity the [MCP Tool User](https://cloud.google.com/iam/docs/roles-permissions/mcp#mcp.toolUser), [Cloud Run Developer](https://cloud.google.com/iam/docs/roles-permissions/run#run.developer), [Service Account User](https://cloud.google.com/iam/docs/roles-permissions/iam#iam.serviceAccountUser), and [Artifact Registry Reader](https://cloud.google.com/iam/docs/roles-permissions/artifactregistry#artifactregistry.reader) roles, or equivalent permissions appropriate for the operations you need. Cross-project service accounts also require Service Account Token Creator.
  3. Ensure your Obot administrator has configured a Google Web OAuth client for this catalog entry.

  When you connect, Google asks you to authorize Obot. Tool calls use your Google identity and its IAM permissions.

  See Google's [Cloud Run MCP setup guide](https://cloud.google.com/run/docs/use-cloud-run-mcp) and [MCP authentication guide](https://cloud.google.com/mcp/authenticate-mcp) for complete instructions.

  ## Important differences

  Unlike the existing containerized Cloud Run entry, this managed server does not provide tools to list or create Google Cloud projects or retrieve service logs. It adds source archive deployment. Inline source requests are limited to 50 MiB, and source archives are limited to 250 MiB.
metadata:
  categories: Cloud Infrastructure,Deployment,Container Orchestration
icon: https://avatars.githubusercontent.com/u/2810941?s=48&v=4
repoURL: https://cloud.google.com/run/docs/use-cloud-run-mcp
runtime: remote
remoteConfig:
  fixedURL: https://run.googleapis.com/mcp
  staticOAuthRequired: true
toolPreview:
  - name: get_service
    description: Get details about a Cloud Run service, including its URI and deployment status.
    params:
      name: Cloud Run service name
      project: Google Cloud project ID or number
      region: Google Cloud region containing the service
  - name: list_services
    description: List Cloud Run services in a Google Cloud project and region.
    params:
      project: Google Cloud project ID or number
      region: Google Cloud region to search
  - name: deploy_service_from_image
    description: Deploy an Artifact Registry or Docker Hub container image as a Cloud Run service.
    params:
      service: Cloud Run service configuration and container image definition
  - name: deploy_service_from_archive
    description: Deploy a self-contained source archive from Cloud Storage as a Cloud Run service.
    params:
      service: Cloud Run service configuration and source archive definition
  - name: deploy_service_from_file_contents
    description: Deploy inline source files as a Cloud Run service.
    params:
      service: Cloud Run service configuration and inline source files
