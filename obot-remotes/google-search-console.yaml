name: Google Search Console
entryKey: obot-google-search-console
serverUserType: singleUser
shortDescription: Use Google Search Console API to get sitemaps, analytics, and more
description: |
  Inspect sitemaps, search analytics, and other Google Search Console data.

  This MCP server is hosted and managed by Obot. Connect with Google OAuth without configuring your own Google Cloud project or OAuth client.

  ## Features
  - **OAuth2 Authentication**: Secure Google OAuth integration with automatic token refresh
  - **Sitemaps**: get, submit, and delete sitemaps
  - **Analytics**: get search analytics, compare time periods, and get page queries
  - **Indexes**: inspect URLs, check indexing issues

  ## What you'll need to connect

  **No Setup Required**: Authentication is handled automatically through OAuth2 workflow

metadata:
  categories: Business
  allow-multiple: "true"
icon: https://img.icons8.com/?size=100&id=V5cGWnc9R4xj&format=png&color=000000
runtime: remote
remoteConfig:
  fixedURL: https://google-search-console-mcp.obot.ai/mcp
