name: Google Docs
entryKey: obot-google-docs
shortDescription: Create and manage documents in Google Docs
description: |
  Create and manage documents in Google Docs.

  This MCP server is hosted and managed by Obot. Connect with Google OAuth without configuring your own Google Cloud project or OAuth client.

  Obot plans to move this catalog entry to Google's official MCP server for Google Docs once it leaves Developer Preview. To try Google's Developer Preview now, see [Configure the Docs MCP server](https://developers.google.com/workspace/docs/api/guides/configure-mcp-server).

  ## Features
  - **OAuth2 Authentication**: Secure Google OAuth integration with automatic token refresh
  - **Document Management**: Create, read, modify, and delete documents with full lifecycle control

  ## What you'll need to connect

  **No Setup Required**: Authentication is handled automatically through OAuth2 workflow

metadata:
  categories: Business
  allow-multiple: "true"
icon: https://img.icons8.com/color/96/google-docs--v1.png
runtime: remote
remoteConfig:
  fixedURL: https://google-docs-mcp.obot.ai/mcp
