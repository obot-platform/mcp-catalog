name: Composio Connect
entryKey: obot-composio
serverUserType: singleUser
shortDescription: Connect your assistant to more than 1,000 apps through one MCP server
description: |
  Access more than 1,000 applications through one [Composio Connect](https://docs.composio.dev/docs/composio-connect) MCP connection. Its small set of meta-tools discovers app-specific tools, connects accounts on demand, and executes actions without loading every integration into the model context.

  ## Features
  - Discover relevant tools across Gmail, Notion, Slack, GitHub, Linear, HubSpot, and many other apps
  - Connect and manage upstream application accounts through user-approved authorization flows
  - Fetch exact schemas and execute up to 50 independent actions in parallel
  - Process large results with a persistent remote Python workbench or remote Bash sandbox

  ## What you'll need to connect
  - A Composio account
  - A consumer API key from **Composio Dashboard → AI Clients**
  - Browser access to authorize each upstream application when prompted

  Connected applications persist across sessions and can be disconnected or reauthorized from the Composio dashboard.

  ## Security guidance
  Composio can act on every connected application's data and may expose destructive upstream operations. Review requested authorizations and require approval before writes, deletions, bulk execution, or connection changes. The remote workbench and Bash tools execute code in a Composio-hosted sandbox and should also require approval. Prefer dedicated vendor entries when you need a narrower, easier-to-audit tool surface.

metadata:
  categories: SaaS & API Integrations, Productivity, Developer Tools
icon: https://composio.dev/favicon.ico
