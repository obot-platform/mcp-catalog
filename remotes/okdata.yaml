shortDescription: Read RedNote, Douyin and WeChat in English, plus TikTok, YouTube, X and Reddit: posts, comments, creators, trends
description: |
  Read what Chinese consumers post on RedNote (Xiaohongshu), Douyin, WeChat Official Accounts, Weibo and Bilibili from anywhere, with no Chinese phone number or platform account: search posts, read comments, look up creators and their official rates, and follow the hot lists. The same server covers TikTok, YouTube, Instagram, X, Reddit and Amazon, 30 platforms in all. See the official [okdata MCP setup guide](https://okdata.online/mcp/?src=obot-catalog) for connection steps and the list of data it can fetch.

  ## Features
  - Search posts and videos by keyword, and read their comments and replies
  - Look up creator and account profiles with follower and engagement counts, and list their recent posts
  - Follow trending searches and hot lists, including the Douyin, Weibo and RedNote boards
  - Find creators on Douyin Xingtu and RedNote PGY with their listed rates
  - Pull YouTube transcripts and ad library entries

  ## What you'll need to connect

  **Required:**
  - **okdata Account**: Each user signs in through OAuth; the agent only reads public data and needs no TikTok, RedNote or other platform login

