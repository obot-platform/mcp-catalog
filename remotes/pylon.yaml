name: Pylon
entryKey: obot-pylon
serverUserType: singleUser
shortDescription: Search, manage, and resolve customer support issues
description: |
  Search and manage Pylon customer-support issues, accounts, contacts, and conversations from an AI client. See [Pylon's MCP connection guide](https://support.usepylon.com/articles/2407390554-connecting-to-the-pylon-mcp-server) for supported-client setup, OAuth authentication, and access behavior.

  ## Features
  - Search customer-support issues and accounts
  - Read issue details, messages, contacts, and account records
  - Create and update support issues and account information

  ## What you'll need to connect

  A Pylon account with the access needed for the records you manage. Pylon uses OAuth; the connected client acts with your existing Pylon permissions.

