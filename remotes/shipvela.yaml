name: Shipvela
entryKey: obot-shipvela
serverUserType: singleUser
shortDescription: Create website projects, publish GitHub repositories, and inspect deployments
description: |
  Create website projects, publish supported GitHub repositories, and inspect deployment status through Shipvela.
  See the [official setup and permissions documentation](https://shipvela.com/integrations/codex).

  ## Features
  - List owned projects and discover repositories from an existing GitHub connection
  - Check framework compatibility and create website projects
  - Deploy the current supported remote GitHub branch and inspect operation and deployment status
  - Read bounded build logs and plan usage

  ## What you'll need to connect
  - A Shipvela account; public signup and a free Hobby plan are available at [shipvela.com](https://shipvela.com/)
  - Each user signs in through OAuth with dynamic client registration and S256 PKCE
  - The requested scopes are projects:read, projects:write, deployments:write, logs:read, and usage:read
  - GitHub deployments use the user's existing connected repository access; local files require the separate Shipvela CLI

  The integration is currently a directly distributed beta. It does not change billing, delete projects, or write environment secrets.
