shortDescription: Capture, search, organize, and update Mem knowledge
description: |
  Search, create, edit, and organize notes, attachments, recordings, and collections in Mem. See the [Mem MCP setup guide](https://docs.mem.ai/mcp/setup) for OAuth instructions for Codex, ChatGPT, Gemini, and other supported clients.

  ## Features
  - Capture and semantically search notes
  - Organize knowledge with collections
  - Update, trash, and restore notes

  ## What you'll need to connect
  **Required:**
  - **Mem Account**: Sign in through Mem when OAuth opens
