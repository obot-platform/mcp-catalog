name: Dynatrace
entryKey: obot-dynatrace
serverUserType: singleUser
shortDescription: Access Dynatrace observability data and intelligence through the official hosted MCP server
upgradeNote: |
  This replaces the Obot-hosted Dynatrace server with Dynatrace's official SaaS MCP gateway.

  - **Reconnect required:** Provide a Dynatrace SaaS environment identifier and a Platform Token with MCP gateway and tool-specific permissions.
  - **Compatibility:** Dynatrace Managed and classic environments are no longer supported.
  - **Tool changes:** Tool names and parameters change.
description: |
  Investigate observability data and use Dynatrace Intelligence through [Dynatrace's secure, governed MCP server](https://docs.dynatrace.com/docs/dynatrace-intelligence/dynatrace-mcp), hosted and maintained in your SaaS environment.

  See Dynatrace's [official MCP server documentation](https://docs.dynatrace.com/docs/dynatrace-intelligence/dynatrace-mcp) for setup instructions, authentication requirements, permissions, and current capabilities.

  ## Features

  - **Grail Data Analysis**: Generate, explain, and execute DQL for logs, metrics, spans, events, and entity data
  - **Problem Investigation**: Find problems, view problem details, investigate vulnerabilities, and retrieve Kubernetes events
  - **Topology Discovery**: Resolve Dynatrace entity names and IDs through Smartscape
  - **Dynatrace Intelligence**: Analyze time series, find documents and troubleshooting guides, and ask product questions

  ## What you'll need to connect

  - **Dynatrace SaaS Platform environment**: Enter the environment identifier from `https://<environment>.apps.dynatrace.com`. Dynatrace Managed and classic `*.live.dynatrace.com` environments are not supported.
  - **Dynatrace Platform Token**: Create a token with `mcp-gateway:servers:invoke` and `mcp-gateway:servers:read`, plus permissions for the tools you intend to use. DQL access commonly requires `storage:buckets:read` and the relevant `storage:*:read` permissions. See the [Dynatrace MCP server documentation](https://docs.dynatrace.com/docs/dynatrace-intelligence/dynatrace-mcp).
  - **Relevant Dynatrace products**: Grail is required for DQL data access. Dynatrace Intelligence permissions are required for DQL generation, explanation, troubleshooting, and analysis tools.

  Dynatrace also supports OAuth with a confidential client, but does not support Dynamic Client Registration. This catalog entry therefore uses a per-user Platform Token rather than shared static OAuth credentials.

  ## Cost and access notes

  DQL queries can incur Grail consumption charges. Use narrow timeframes and filters, and grant only the permissions required for the intended workflows.

  > **⚠️ Upgrade notice**
  >
  > If you're upgrading this server, note that this replaces the Obot-hosted Dynatrace server with Dynatrace's official SaaS MCP gateway.
  >
  > - **Reconnect required:** Provide a Dynatrace SaaS environment identifier and a Platform Token with MCP gateway and tool-specific permissions.
  > - **Compatibility:** Dynatrace Managed and classic environments are no longer supported.
  > - **Tool changes:** Tool names and parameters change.
metadata:
  categories: Monitoring, Developer Tools, DevOps
  allow-multiple: "true"
icon: https://avatars.githubusercontent.com/u/58178984?s=48&v=4
repoURL: https://docs.dynatrace.com/docs/dynatrace-intelligence/dynatrace-mcp
env:
- key: DYNATRACE_ENVIRONMENT
  name: Dynatrace Environment
  required: true
  sensitive: false
  description: Your Dynatrace SaaS environment identifier, for example abc12345 from https://abc12345.apps.dynatrace.com.
runtime: remote
remoteConfig:
  urlTemplate: https://${DYNATRACE_ENVIRONMENT}.apps.dynatrace.com/platform-reserved/mcp-gateway/v0.1/servers/dynatrace-mcp/mcp
  headers:
  - key: Authorization
    name: Dynatrace Platform Token
    required: true
    sensitive: true
    prefix: "Bearer "
    description: A Dynatrace Platform Token with MCP gateway and tool-specific permissions.
toolPreview:
- name: adaptive-anomaly-detector
  description: Detect anomalies in time-series data using an adaptive threshold.
  params:
    alertCondition: Alert condition for detected anomalies.
    alertOnMissingData: Whether missing data triggers an alert.
    dealertingSamples: Samples required to clear an alert.
    generalParameters: General analyzer parameters.
    numberOfSignalFluctuations: Expected signal fluctuations.
    slidingWindow: Analysis window size.
    timeSeriesData: Time-series data to analyze.
    violatingSamples: Samples required to trigger an alert.
- name: ask-dynatrace-docs
  description: Answer questions about Dynatrace documentation and product capabilities.
  params:
    prompt: Question to answer.
- name: create-dql
  description: Generate a DQL query from a natural-language request.
  params:
    request: Natural-language data request.
- name: execute-dql
  description: Execute a DQL query against Grail.
  params:
    dqlQueryString: DQL query to execute.
    includeTypes: Types of data to include in the result.
- name: explain-dql
  description: Explain a DQL query in natural language.
  params:
    dql: DQL query to explain.
- name: find-documents
  description: Search Dynatrace dashboards and notebooks by title.
  params:
    searchString: Title text to search for.
- name: find-troubleshooting-guides
  description: Search available troubleshooting guides.
  params:
    searchStrings: Terms used to search troubleshooting guides.
- name: get-dynatrace-compliance-findings
  description: Retrieve Dynatrace Security Posture Management compliance findings.
  params:
    customSummarizationAndFieldsSelection: Result fields and summarization settings.
    entityIdsOrNames: Entity IDs or names to filter by.
    includeTypes: Types of data to include in the result.
    maxResults: Maximum findings to return.
    resultStatus: Compliance finding statuses to include.
    riskLevels: Risk levels to include.
    ruleIds: Compliance rule IDs to include.
    ruleTitles: Compliance rule titles to include.
    standards: Compliance standards to include.
    systems: Systems to include.
- name: get-dynatrace-vulnerabilities
  description: Retrieve Dynatrace Runtime Vulnerability Analytics findings.
  params:
    components: Affected components to include.
    customFilters: Additional filters for vulnerabilities.
    customSummarizationAndFieldsSelection: Result fields and summarization settings.
    cves: CVEs to include.
    entityIdsOrNames: Entity IDs or names to filter by.
    includeTypes: Types of data to include in the result.
    maxResults: Maximum vulnerabilities to return.
    muteStatus: Mute statuses to include.
    resolutionStatus: Resolution statuses to include.
    riskLevels: Risk levels to include.
    vulnerabilityIds: Vulnerability IDs to include.
- name: get-entity-id
  description: Look up entity IDs by name and type.
  params:
    entityNameFilter: Entity name filter.
    entityType: Dynatrace entity type.
    includeTypes: Types of data to include in the result.
- name: get-entity-name
  description: Resolve an entity ID to its display name.
  params:
    entityId: Dynatrace entity ID.
    entityType: Dynatrace entity type.
    includeTypes: Types of data to include in the result.
- name: get-events-for-kubernetes-cluster
  description: Retrieve Kubernetes cluster events.
  params:
    clusterId: Kubernetes cluster ID.
    findAllK8Events: Whether to return events for all clusters.
    history: Time range for event history.
    includeTypes: Types of data to include in the result.
    kubernetesEntityId: Dynatrace Kubernetes cluster entity ID.
- name: get-problem-by-id
  description: Retrieve details for a Dynatrace problem.
  params:
    history: Time range for problem history.
    includeTypes: Types of data to include in the result.
    problemId: Dynatrace problem display ID.
- name: get-security-event-details
  description: Retrieve details for a security event.
  params:
    findingID: Security finding ID.
    includeTypes: Types of data to include in the result.
    maxResults: Maximum events to return.
    scanID: Security scan ID.
    timeRange: Time range for security events.
    title: Security event title.
- name: get-security-events-summary
  description: Summarize Dynatrace and external security events.
  params:
    components: Affected components to include.
    customFilters: Additional security event filters.
    cves: CVEs to include.
    entityIdsOrNames: Entity IDs or names to filter by.
    eventTypes: Security event types to include.
    includeTypes: Types of data to include in the result.
    maxResults: Maximum events to return.
    products: Security products to include.
    providers: Security providers to include.
    riskLevels: Risk levels to include.
    summarizationString: Summary configuration.
    timeRange: Time range for security events.
- name: log-pattern-extractor
  description: Extract recurring patterns from log-query results.
  params:
    generalParameters: General analyzer parameters.
    logQuery: DQL query that returns log lines.
    numberOfExamples: Number of examples to return.
- name: query-problems
  description: Query Dynatrace problems.
  params:
    history: Time range for problem history.
    includeTypes: Types of data to include in the result.
    status: Problem statuses to include.
- name: seasonal-baseline-anomaly-detector
  description: Detect anomalies using seasonal time-series baselines.
  params:
    alertCondition: Alert condition for detected anomalies.
    alertOnMissingData: Whether missing data triggers an alert.
    dealertingSamples: Samples required to clear an alert.
    generalParameters: General analyzer parameters.
    slidingWindow: Analysis window size.
    timeSeriesData: Time-series data to analyze.
    tolerance: Seasonal baseline tolerance.
    violatingSamples: Samples required to trigger an alert.
- name: static-threshold-analyzer
  description: Detect time-series values that violate a static threshold.
  params:
    alertCondition: Alert condition for threshold violations.
    alertOnMissingData: Whether missing data triggers an alert.
    dealertingSamples: Samples required to clear an alert.
    generalParameters: General analyzer parameters.
    slidingWindow: Analysis window size.
    threshold: Static threshold to evaluate.
    timeSeriesData: Time-series data to analyze.
    violatingSamples: Samples required to trigger an alert.
- name: timeseries-forecast
  description: Forecast future time-series values from a DQL query.
  params:
    forecastHorizon: Number of future data points to predict.
    forecastOffset: Offset before the forecast begins.
    generalParameters: General analyzer parameters.
    query: DQL time-series query.
- name: timeseries-novelty-detection
  description: Detect time-series changepoints and novelty scores.
  params:
    analysisNoveltyType: Type of novelty analysis.
    detectionMode: Novelty detection mode.
    filterSpikes: Whether to filter spikes.
    generalParameters: General analyzer parameters.
    minNoveltyScore: Minimum novelty score to include.
    significanceLevel: Statistical significance level.
    timeSeriesData: Time-series data to analyze.
