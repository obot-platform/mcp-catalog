name: Tripadvisor
entryKey: obot-tripadvisor
serverUserType: singleUser
shortDescription: Research and compare hotels with live Tripadvisor details, reviews, photos, and prices
description: |
  Search for hotels, compare accommodations, and retrieve live Tripadvisor details including traveler reviews, ratings, photos, availability, prices, amenities, and nearby attractions. Visit [Tripadvisor](https://www.tripadvisor.com/) to explore its hotel-search and trip-planning experience.

  ## Features
  - Search for hotels by destination and reuse Tripadvisor location identifiers
  - Compare multiple properties using current traveler and listing data
  - Retrieve hotel details, amenities, photos, reviews, and ratings
  - Check availability and pricing for specific travel dates
  - Discover nearby attractions and points of interest

  ## What you'll need to connect

  No account or API credential is required. Hotel search and pricing availability may vary by destination, dates, and market.

