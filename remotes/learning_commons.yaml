name: Learning Commons Knowledge Graph
entryKey: obot-learning-commons-knowledge-graph
serverUserType: singleUser
shortDescription: Resolve K-12 standards, learning components, and skill progressions
description: |
  Resolve authoritative K-12 academic standards, break standards into teachable learning components, and trace prerequisite or follow-on skills. See the [Learning Commons MCP server documentation](https://docs.learningcommons.org/knowledge-graph/using-knowledge-graph/mcp-server) for setup, authentication, tools, and examples.

  ## Features
  - Look up official academic-standard statements and metadata by code
  - Decompose mathematics standards into granular learning components
  - Trace prior and subsequent standards through learning progressions
  - Ground curriculum planning and instructional content in structured education data

  ## What you'll need to connect

  **Required:**
  - **Learning Commons API Key**: Create and manage an API key in the Learning Commons Platform

metadata:
  categories: Education, Data & Analytics, SaaS & API Integrations
icon: https://docs.learningcommons.org/favicon.ico
repoURL: https://docs.learningcommons.org/knowledge-graph/using-knowledge-graph/mcp-server
runtime: remote
remoteConfig:
  fixedURL: https://kg.mcp.learningcommons.org/mcp
  headers:
  - name: Learning Commons API Key
    description: API key created in the Learning Commons Platform
    key: x-api-key
    required: true
    sensitive: true
