name: Klaviyo
entryKey: obot-klaviyo
serverUserType: singleUser
shortDescription: Analyze campaigns and flows, manage profiles and audiences, and create marketing content
description: |
  Analyze campaign and flow performance, manage profiles and audiences, and create marketing campaigns and templates using live Klaviyo data. See the [Klaviyo MCP server documentation](https://developers.klaviyo.com/en/docs/klaviyo_mcp_server) for setup, tools, permissions, and security guidance.

  ## Features
  - Review campaign, flow, metric, and conversion performance
  - Search profiles, lists, segments, events, and catalog data
  - Create and update campaigns, templates, profiles, and catalog content
  - Manage marketing subscriptions and audience membership
  - Generate campaign and flow reports

  ## Connection options

  - **Read-only mode:** Disables tools that modify Klaviyo data. Keep this enabled unless write actions are required.
  - **Disable user-generated content tools:** Excludes tools whose content could contain untrusted instructions. Keep this enabled unless those tools are required, and review tool calls carefully if you disable it.

  ## What you'll need to connect

  **Required:**
  - **Klaviyo Account**: You must have the Owner, Admin, or Manager role

metadata:
  categories: Marketing, Data & Analytics, Communication
icon: https://developers.klaviyo.com/favicon.ico
repoURL: https://developers.klaviyo.com/en/docs/klaviyo_mcp_server
env:
  - name: Access Mode
    key: READ_ONLY
    description: Choose read-only access or enable tools that can modify Klaviyo data.
    required: true
    sensitive: false
    options:
      - name: Read only
        value: "true"
        description: Disable all tools that can perform write actions.
      - name: Read and write
        value: "false"
        description: Enable campaign, profile, catalog, subscription, and other write actions.
  - name: User-Generated Content
    key: DISABLE_USER_CONTENT
    description: Choose whether tools that return user-generated content are available.
    required: true
    sensitive: false
    options:
      - name: Disable these tools
        value: "true"
        description: Reduce prompt-injection exposure by excluding tools that return user-generated content.
      - name: Enable these tools
        value: "false"
        description: Include tools that may return untrusted user-generated content.
runtime: remote
remoteConfig:
  urlTemplate: https://mcp.klaviyo.com/mcp?read-only=${READ_ONLY}&disable-tools-with-user-generated-content=${DISABLE_USER_CONTENT}
