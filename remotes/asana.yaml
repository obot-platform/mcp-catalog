name: Asana
entryKey: obot-asana
serverUserType: singleUser
shortDescription: Manage Asana tasks, projects, and portfolios through Asana's official MCP server
upgradeNote: |
  This replaces Asana's deprecated V1 beta server with the generally available Asana V2 MCP server.

  - **Reconnect required:** An Obot administrator must configure a statically registered Asana MCP OAuth client. Existing V1 connections and tokens cannot be reused.
  - **Workspace selection:** Each connection is authorized for one workspace. Connect the server separately to work with additional workspaces.
  - **Tool changes:** Tool names and parameters change. Dedicated goal mutation, time-period lookup, workspace listing, and several granular task helper tools are no longer available; some task operations are consolidated into bulk create and update tools.
  - **New capabilities:** V2 adds bulk task operations, status overviews, comments, and AI Teammate discovery.
description: |
  Search and manage tasks, projects, portfolios, users, teams, attachments, comments, status updates, and AI Teammates through [Asana's official MCP server](https://developers.asana.com/docs/using-asanas-mcp-server).

  See Asana's [MCP server guide](https://developers.asana.com/docs/using-asanas-mcp-server), [integration guide](https://developers.asana.com/docs/integrating-with-asanas-mcp-server), and [tool reference](https://developers.asana.com/docs/mcp-tools-reference) for current setup requirements and capabilities.

  ## What you'll need to connect

  Ask your Obot administrator to create an **MCP app** in the Asana developer console and:

  1. Add Obot's OAuth callback URL exactly as shown by Obot.
  2. Configure the app under **Manage distribution** for either the specific workspaces that may use it or **Any workspace**.
  3. Configure the app's client ID and client secret for this catalog entry in Obot. Asana V2 does not support dynamic client registration.
  4. Ensure the app is allowed by your Asana workspace's app-management policy.

  When you connect, Asana asks you to select and authorize one workspace. Tool calls use your Asana identity and cannot access data beyond your existing permissions. Access tokens expire after one hour; Obot uses the refresh token to maintain the connection.

  ## Important differences

  V2 uses Streamable HTTP at `https://mcp.asana.com/v2/mcp`. Its OAuth tokens are workspace-scoped and valid only for the MCP server, not Asana's REST API. MCP apps do not request individual OAuth scopes; an authorization can use all MCP tools made available by Asana, subject to the user's existing permissions.

  V2 preserves the main task, project, user, team, portfolio, attachment, comment, and project-status workflows. It does not provide direct replacements for V1's goal creation and update tools, time-period tools, workspace enumeration, task follower helpers, or standalone dependency and parent helpers. Bulk task updates cover many follower, dependency, parent, and project-membership changes.

  > **⚠️ Upgrade notice**
  >
  > If you're upgrading this server, note that this replaces Asana's deprecated V1 beta server with the generally available Asana V2 MCP server.
  >
  > - **Reconnect required:** An Obot administrator must configure a statically registered Asana MCP OAuth client. Existing V1 connections and tokens cannot be reused.
  > - **Workspace selection:** Each connection is authorized for one workspace. Connect the server separately to work with additional workspaces.
  > - **Tool changes:** Tool names and parameters change. Dedicated goal mutation, time-period lookup, workspace listing, and several granular task helper tools are no longer available; some task operations are consolidated into bulk create and update tools.
  > - **New capabilities:** V2 adds bulk task operations, status overviews, comments, and AI Teammate discovery.
metadata:
  categories: Business, Developer Tools
  allow-multiple: "true"
icon: https://avatars.githubusercontent.com/u/1472111?s=200&v=4
repoURL: https://developers.asana.com/docs/using-asanas-mcp-server
runtime: remote
remoteConfig:
  fixedURL: https://mcp.asana.com/v2/mcp
  staticOAuthRequired: true
toolPreview:
  - name: search_objects
    description: Search across Asana tasks, projects, portfolios, goals, teams, users, tags, custom fields, and AI Teammates.
  - name: get_task
    description: Get full details for a task, including its memberships, dependencies, subtasks, custom fields, and comments.
  - name: get_tasks
    description: List tasks by project, section, tag, user task list, or assignee, with optional completion and modification filters.
  - name: get_my_tasks
    description: List tasks assigned to the authenticated user, optionally filtered by completion status.
  - name: search_tasks
    description: Search task names, descriptions, and comments with advanced filters. Advanced search requires a supported Asana plan.
  - name: get_project
    description: Get project details, membership, task counts, and optionally project sections.
  - name: get_projects
    description: List projects in the authorized workspace, optionally filtered by team or archived status.
  - name: get_portfolio
    description: Get details for a portfolio and its associated projects.
  - name: get_portfolios
    description: List portfolios owned by the authenticated user in the authorized workspace.
  - name: get_items_for_portfolio
    description: List projects and goals contained in a portfolio.
  - name: get_status_overview
    description: Build an aggregated status overview for projects or portfolios, including updates, task summaries, and blockers.
  - name: get_attachments
    description: List attachments for a task, project, or project brief.
  - name: get_user
    description: Get a user by GID, email address, or the value me.
  - name: get_me
    description: Get the authenticated user's profile and workspace memberships.
  - name: get_users
    description: List users in the authorized workspace, optionally filtered by team.
  - name: get_teams
    description: List teams in the authorized workspace, optionally filtered by user membership.
  - name: get_agent
    description: Get the full record for an Asana AI Teammate by GID.
  - name: get_workspace_agents
    description: List AI Teammates configured in the authorized workspace.
  - name: create_tasks
    description: Create up to 50 tasks or subtasks in one operation, including assignees, dates, followers, and custom fields.
  - name: create_project
    description: Create a project, optionally with its initial sections and tasks.
  - name: update_tasks
    description: Update up to 50 tasks, including completion, assignment, dates, hierarchy, dependencies, followers, projects, and custom fields.
  - name: delete_task
    description: Permanently delete a task and eligible subtasks. This action cannot be undone.
  - name: add_comment
    description: Add a plain-text or HTML comment to a task, with support for mentions and pinned comments.
  - name: create_project_status_update
    description: Post a status update to a project or portfolio.
