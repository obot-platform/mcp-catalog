name: Surfer
entryKey: obot-surfer
shortDescription: Create, optimize, and score SEO content with live Surfer data
description: |
  Create, optimize, and score content using live SEO and AI Search data, guidelines, and brand context from Surfer. See the [Surfer MCP documentation](https://docs.surferseo.com/en/articles/12944186-surfer-mcp) for setup, supported workflows, plan requirements, and usage limits.

  ## Features
  - Create Content Editors for target keywords and generate articles with Surfer AI
  - Optimize existing content, run Auto-Optimize, and check SEO and AI Search scores
  - Review and adjust terms, topics, structure, competitors, and content guidelines
  - Get recommendations for pages to optimize and new topics to cover
  - Manage workspaces, brand knowledge, custom voices, and templates
  - Retrieve AI visibility data from AI Tracker

  ## What you'll need to connect

  **Required:**
  - **Eligible Surfer Account**: A Pro, Peace of Mind, Enterprise, or AI Search Analytics plan with MCP access; each user signs in through OAuth

  Actions performed through MCP are subject to your Surfer subscription limits. Read-only requests do not consume those limits.

