name: Atlassian
entryKey: obot-atlassian
shortDescription: Search and manage Jira, Confluence, Bitbucket, and other Atlassian work
upgradeNote: |
  This entry now connects to Atlassian MCP v2.

  - **Existing vMCPs stay on V1 until updated:** Catalog sync makes this revision available, but a vMCP keeps its saved V1 component until its owner applies the update.
  - **Choose a mode when updating:** The V1 entry had no mode setting, so select Discovery or Flat list for the new required configuration field. Shared vMCP owners can preconfigure a mode or ask each connecting user to select one.
  - **Reconnect required:** V2 is a separate OAuth resource. Sign in again after updating; V1 credentials cannot be reused.
  - **Review access:** Tool names and schemas may change. Review configured tool selections and vMCP profiles after reconnecting, especially when changing modes.
  - **V1 transition:** Atlassian says existing V1 connections will begin exposing V2 tools on March 1, 2027. Migrating explicitly now gives you control over the mode and tool grants.
description: |
  Search and manage Jira work items, Confluence content, Bitbucket repositories, and other Atlassian work through [Atlassian MCP v2](https://support.atlassian.com/atlassian-ai-gateway/docs/get-started-with-the-atlassian-remote-mcp-server/).

  See Atlassian's [supported tools](https://support.atlassian.com/atlassian-ai-gateway/docs/supported-tools/) and [migration guide](https://support.atlassian.com/atlassian-ai-gateway/docs/how-to-upgrade-from-atlassian-mcp-v1-to-atlassian-mcp-v2/) for current capabilities and upgrade instructions.

  ## Tool exposure mode

  - **Discovery** (`https://mcp.atlassian.com/v2/mcp`): Exposes primary tools and `discover`, `executeRead`, `executeWrite`, and `executeDestructive` for deferred operations. This keeps the initial tool list small.
  - **Flat list** (`https://mcp.atlassian.com/v2/mcp?tools=all`): Exposes individual tools through paginated `tools/list` responses. Choose this mode to review or pin individual tool names and schemas and apply Obot's per-tool grants. Use Obot v0.26.2 or newer to retrieve every page.

  In discovery mode, Obot grants and tool-level audit records apply to the exposed discovery and execution tools. A deferred operation is not a separate top-level Obot tool call, so Obot cannot grant or deny that operation by its individual tool name. Obot's tool-level audit identifies the wrapper call; inspect available call arguments and Atlassian's own controls for the deferred operation. In flat-list mode, Obot can grant and audit each exposed tool by name.

  ## Connect or migrate

  Select a tool exposure mode, then sign in with Atlassian OAuth. Your Atlassian app permissions and your organization's MCP controls still apply. If your organization restricts OAuth redirects, ask an admin to allow the Obot callback URL shown during setup.

  To move an existing V1 vMCP connection to V2, apply the available component update, select a mode for the new required configuration field, and complete the new OAuth flow. Existing V1 credentials and the V1 URL do not supply a mode value. Review and update saved tool selections and vMCP profiles; grants for tools absent from V2 may be removed, and newly exposed tools need a deliberate access review. See Atlassian's [V1 to V2 migration guide](https://support.atlassian.com/atlassian-ai-gateway/docs/how-to-upgrade-from-atlassian-mcp-v1-to-atlassian-mcp-v2/).
metadata:
  categories: Developer Tools
  allow-multiple: "true"
icon: https://avatars.githubusercontent.com/u/168166?s=200&v=4
repoURL: https://support.atlassian.com/atlassian-ai-gateway/docs/get-started-with-the-atlassian-remote-mcp-server/
config:
  - name: Tool exposure mode
    key: ATLASSIAN_MCP_PATH
    description: Choose discovery for a compact tool list or flat list for individual tool grants.
    required: true
    sensitive: false
    options:
      - name: Discovery
        value: v2/mcp
        description: Expose primary tools and discovery and execution tools for deferred operations.
      - name: Flat list
        value: v2/mcp?tools=all
        description: Expose individual tools through paginated tool-list responses.
    usage: env
runtime: remote
remoteConfig:
  urlTemplate: https://mcp.atlassian.com/${ATLASSIAN_MCP_PATH}
