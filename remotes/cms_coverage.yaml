name: CMS Coverage
entryKey: obot-cms-coverage
serverUserType: singleUser
shortDescription: Search Medicare Part B national and local coverage policies
description: |
  Search the CMS Medicare Coverage Database for Part B National Coverage Determinations, Local Coverage Determinations, billing articles, contractors, and recent policy changes. See the official [CMS Coverage connector tutorial](https://academy.claude.com/tutorials/using-the-cms-coverage-connector-in-claude) for scope, setup, and example workflows.

  ## Features
  - Search national coverage documents including NCDs, analyses, advisory meetings, and technology assessments
  - Search local LCDs, proposed LCDs, and billing articles by contractor or geography
  - Retrieve full coverage documents and batch-fetch multiple NCDs
  - Find Medicare Administrative Contractors by state
  - Review recent national and local policy changes and self-administered drug exclusions

  ## Coverage scope
  This connector covers Medicare Part B medical services, including procedures, durable medical equipment, laboratory tests, and provider-administered injectable drugs. It does not cover Part A inpatient benefits, Part C plan-specific policies, or Part D prescription-drug formularies.

  **Read only:** This connector searches public coverage policy data and does not modify CMS records.

  Returned data may be governed by the [CMS Coverage API license agreement](https://api.coverage.cms.gov/v1/metadata/license-agreement/). Verify policy details against the source record before relying on them for coverage or clinical decisions.

