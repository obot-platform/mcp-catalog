shortDescription: "Search, segment, chart, and analyze customer feedback"
description: |
  Explore customer-feedback views, search themes and issues, filter by metadata, chart trends, sample and classify feedback, analyze comments, and retrieve supporting anecdotes for product research and planning. See the [official Unwrap MCP guide](https://docs.unwrap.ai/articles/6412771011-unwrap-mcp) for the exact endpoint, setup in supported clients, authentication, recommended workflows, and tool reference.

  ## What you'll need to connect
  - **Unwrap account**: Sign in through OAuth
  - **View permissions**: Available feedback and views follow your existing Unwrap team access
