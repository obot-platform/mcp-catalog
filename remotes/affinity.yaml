name: Affinity
entryKey: obot-affinity
serverUserType: singleUser
shortDescription: Search and update Affinity relationships, pipelines, meetings, and notes
description: |
  Search Affinity companies, people, opportunities, meetings, notes, and relationship history, and update pipeline records directly from your AI workflow. See the official [Affinity MCP introduction](https://developer.affinity.co/pages/mcp/introduction) and [generic-client setup guide](https://developer.affinity.co/pages/mcp/other-clients) for capabilities, plan requirements, API-key authentication, and configuration.

  ## Features
  - Search companies, people, opportunities, notes, meetings, and workspace lists
  - Review relationship strength, interaction history, transcripts, and upcoming meetings
  - Create list entries, notes, reminders, opportunities, and other pipeline records
  - Update entity and list-entry field values as deals progress
  - Retrieve custom fields, workflows, dropdown options, and saved list information
  - Perform semantic searches across Affinity relationship intelligence

  ## What you'll need to connect

  **Required:**
  - **Affinity Scale, Advanced, or Enterprise Plan**
  - **Affinity API Key**: Generate an API key for the user whose permissions the connector should inherit

  This connector can read and modify Affinity data within the issuing user's permissions.

