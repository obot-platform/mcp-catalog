name: PDF Viewer
entryKey: obot-pdf-viewer
serverUserType: singleUser
shortDescription: Render supported academic PDFs in an interactive viewer for reading and discussion
description: |
  Display PDFs from approved academic repositories in an interactive PDF.js viewer, keeping the current page and selected text available as conversational context. See the [PDF Server documentation](https://github.com/modelcontextprotocol/ext-apps/blob/main/examples/pdf-server/README.md) for supported sources, viewer behavior, tools, deployment details, and security constraints.

  ## Features
  - Render remote PDFs from approved academic sources such as arXiv, bioRxiv, Zenodo, and OSF
  - Stream large documents in chunks for clients with tool-response size limits
  - Navigate pages and expose the current page text to the model
  - Open links back to the original publication source
  - Preserve viewer position and adapt to the host's display mode and theme

  ## What you'll need to connect

  No account or API credential is required. This hosted example accepts PDFs only from its allowlisted remote sources and does not provide access to local files.

