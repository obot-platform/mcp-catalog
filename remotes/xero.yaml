name: Xero
entryKey: obot-xero
serverUserType: singleUser
shortDescription: Review profit, cash, invoices, customers, receivables, payables, and financial position
description: |
  Review profit and loss, cash position, invoices, customers, receivables, payables, and balance-sheet summaries from one Xero organisation. See [Xero's connector documentation](https://central.xero.com/0/article/Connect-Xero-using-the-Xero-connector-in-Claude) for capabilities, supported questions, date handling, and access requirements.

  ## Features
  - Review profit and loss with flexible date ranges and prior-year comparisons
  - Inspect cash balances, assets, liabilities, and overall financial position
  - Find outstanding and overdue invoices
  - Review aged receivables and aged payables
  - Identify top customers by revenue and retrieve contact details

  ## What you'll need to connect

  **Required:**
  - **Xero Business Plan**: The connector is available to organisations on Xero business pricing plans
  - **Xero OAuth App**: Create an app in the Xero developer portal, register the redirect URI shown by Obot, and provide its client ID and secret

  **Read Only:** The connector retrieves financial information but cannot modify your Xero organisation. It connects to one organisation at a time.

