name: Financial Modeling Prep
entryKey: obot-financial-modeling-prep
serverUserType: singleUser
shortDescription: Research stocks, funds, markets, filings, financial statements, economics, and trading activity
description: |
  Research real-time and historical financial data across stocks, ETFs, funds, crypto, forex, commodities, filings, economics, and trading activity. See the official [Financial Modeling Prep MCP guide](https://site.financialmodelingprep.com/developer/docs/mcp-server) for setup, authentication, and examples.

  ## Features
  - Retrieve quotes, charts, market performance, and technical indicators
  - Analyze company profiles, financial statements, ratios, and discounted cash flow data
  - Search SEC filings, earnings transcripts, news, and analyst information
  - Research ETFs, mutual funds, indexes, commodities, forex, and crypto assets
  - Track insider, institutional, congressional, and commitment-of-traders activity

  ## What you'll need to connect

  **Required:**
  - **FMP API Key**: Create or copy an API key from your Financial Modeling Prep dashboard

  **Usage limits:** Requests use your existing FMP plan limits, and the datasets available depend on your subscription.

metadata:
  categories: Finance, Data & Analytics, Research
icon: https://avatars.githubusercontent.com/u/60474649?v=4
repoURL: https://site.financialmodelingprep.com/developer/docs/mcp-server
env:
  - name: FMP API Key
    key: FMP_API_KEY
    description: API key from your Financial Modeling Prep dashboard
    required: true
    sensitive: true
runtime: remote
remoteConfig:
  urlTemplate: https://financialmodelingprep.com/mcp?apikey=${FMP_API_KEY}
