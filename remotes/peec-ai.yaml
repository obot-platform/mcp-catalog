name: Peec AI
entryKey: obot-peec-ai
serverUserType: singleUser
shortDescription: Analyze brand visibility, sentiment, and share of voice across AI search
description: |
  Analyze your brand's visibility across AI search engines, compare it with competitors, and retrieve the underlying Peec AI reports in natural language. See [Peec AI's MCP documentation](https://docs.peec.ai/mcp/introduction) for supported clients, OAuth and personal-access-token setup, and available tools.

  ## Features
  - List available projects, brands, prompts, topics, and tags
  - Retrieve brand, domain, and URL reports
  - Examine visibility, sentiment, and share of voice across AI search engines

  ## What you'll need to connect

  A Peec AI account with access to the relevant projects. Connect with OAuth 2.0, or use a personal access token when your MCP client cannot complete OAuth.

