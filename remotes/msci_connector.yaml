name: MSCI Connector
entryKey: obot-msci-connector
serverUserType: singleUser
shortDescription: Analyze entitled MSCI index, portfolio, risk, and sustainability data
description: |
  Access entitled MSCI datasets and analytics for indexes, portfolios, private assets, risk, sustainability, and climate research. See MSCI's official [connector support page](https://support.msci.com/support/shared-content/msci-mcp-connector-for-claude/06779542517) for access requirements and current capabilities; an MSCI support sign-in may be required.

  ## Features
  - Query index performance, constituents, exposures, and methodology data
  - Explore private-capital market profiles, benchmarks, holdings, and risk factors
  - Analyze portfolio risk, factor exposures, and transparency results
  - Query sustainability and climate metrics, taxonomies, and reference data
  - Run entitled analytics workflows and retrieve reports and metadata

  ## What you'll need to connect

  **Required:**
  - An MSCI account
  - Product entitlements for each MSCI dataset or analytics capability you want to use

  Sign in through MSCI's OAuth flow. Available tools and results depend on your organization's subscriptions, entitlements, and user permissions.
