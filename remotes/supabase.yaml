name: Supabase
entryKey: obot-supabase
serverUserType: singleUser
shortDescription: Connect to Supabase with selectable read-only access and OAuth or a personal access token
upgradeNote: |
  This replaces the Obot-hosted Supabase server with Supabase's official hosted MCP server.

  - **Reconnect required:** Select read-only or read-and-write access, then connect with OAuth or optionally provide a Supabase personal access token.
  - **Authentication change:** A personal access token is no longer required; OAuth is used when the token is omitted.
  - **Tool changes:** Tool names, parameters, and available project, database, function, branch, storage, and documentation operations change.
description: |
  Manage Supabase projects and development workflows through [Supabase's hosted MCP server](https://supabase.com/docs/guides/ai-tools/mcp).

  See the [official Supabase MCP documentation](https://supabase.com/docs/guides/ai-tools/mcp) for setup, configuration options, and security guidance.

  **Access mode:** Enter `true` for read-only access or `false` to enable potentially destructive read-and-write operations.

  ## What you'll need to connect

  Choose whether to restrict the connection to read-only operations. Read-only access is recommended unless you need to apply migrations, deploy functions, or manage projects and branches.

  Authentication uses OAuth with dynamic client registration by default. You can instead provide a Supabase personal access token for non-interactive access. When a token is provided, Supabase authenticates directly with it and does not start OAuth; when omitted, Obot uses OAuth.

  ## Security

  - Use a development project or branch with non-production data. Never connect this server to production data.
  - Review every tool call before approving it, especially SQL, migrations, deployments, and project or branch operations.

  ## Features

  - **Database**: Inspect schemas and migrations, execute SQL, and optionally apply migrations
  - **Debugging**: Retrieve logs and security or performance advisors
  - **Development**: Get project URLs and publishable keys, and generate TypeScript types
  - **Edge Functions and Branching**: Inspect functions and branches, with optional write operations
  - **Storage and Docs**: Inspect storage configuration and search Supabase documentation

  > **⚠️ Upgrade notice**
  >
  > If you're upgrading this server, note that this replaces the Obot-hosted Supabase server with Supabase's official hosted MCP server.
  >
  > - **Reconnect required:** Select read-only or read-and-write access, then connect with OAuth or optionally provide a Supabase personal access token.
  > - **Authentication change:** A personal access token is no longer required; OAuth is used when the token is omitted.
  > - **Tool changes:** Tool names, parameters, and available project, database, function, branch, storage, and documentation operations change.
metadata:
  categories: Databases
icon: https://supabase.com/favicon/favicon-96x96.png
repoURL: https://supabase.com/docs/guides/ai-tools/mcp
env:
- name: Read Only
  key: READ_ONLY
  description: Enter `true` for read-only access or `false` for read-and-write access. See the entry description for details.
  required: true
  sensitive: false
  options:
  - name: Read only
    value: "true"
    description: Restrict SQL and mutation operations.
  - name: Read and write
    value: "false"
    description: Allow potentially destructive write operations.
runtime: remote
remoteConfig:
  urlTemplate: https://mcp.supabase.com/mcp?read_only=${READ_ONLY}
  headers:
  - name: Supabase Personal Access Token
    description: Optional. Provide a Supabase personal access token for non-interactive authentication. OAuth is used when omitted.
    key: Authorization
    required: false
    sensitive: true
    prefix: "Bearer "
toolPreview:
- name: list_projects
  description: Lists Supabase projects available to the authenticated user.
  params: {}
- name: get_project
  description: Gets details for a Supabase project.
  params:
    id: Project identifier.
- name: create_project
  description: Creates a Supabase project after the user confirms its cost. Requires read and write access.
  params:
    confirm_cost_id: Cost confirmation identifier.
    name: Project name.
    organization_id: Organization identifier.
    region: Deployment region.
- name: pause_project
  description: Pauses a Supabase project. Requires read and write access.
  params:
    project_id: Project identifier.
- name: restore_project
  description: Restores a Supabase project. Requires read and write access.
  params:
    project_id: Project identifier.
- name: list_organizations
  description: Lists organizations available to the authenticated user.
  params: {}
- name: get_organization
  description: Gets organization details.
  params:
    id: Organization identifier.
- name: get_cost
  description: Gets the cost of creating a project or branch.
  params:
    organization_id: Organization identifier.
    type: Resource type.
- name: confirm_cost
  description: Records that the user understands the cost of a project or branch.
  params:
    amount: Cost amount.
    recurrence: Cost recurrence.
    type: Resource type.
- name: search_docs
  description: Searches Supabase documentation.
  params:
    graphql_query: GraphQL documentation query.
- name: list_tables
  description: Lists database tables and optionally their columns, primary keys, and foreign-key constraints.
  params:
    project_id: Project identifier.
    schemas: Schemas to include.
    verbose: Include detailed table metadata.
- name: list_extensions
  description: Lists database extensions.
  params:
    project_id: Project identifier.
- name: list_migrations
  description: Lists database migrations.
  params:
    project_id: Project identifier.
- name: apply_migration
  description: Applies a SQL migration. Requires read and write access.
  params:
    name: Migration name.
    project_id: Project identifier.
    query: SQL migration query.
- name: execute_sql
  description: Executes SQL queries, constrained to a read-only Postgres user when read-only access is selected.
  params:
    project_id: Project identifier.
    query: SQL query.
- name: query_logs
  description: Queries project logs.
  params:
    iso_timestamp_end: End timestamp in ISO 8601 format.
    iso_timestamp_start: Start timestamp in ISO 8601 format.
    project_id: Project identifier.
    sql: Log query SQL.
- name: get_advisors
  description: Retrieves security and performance advisors.
  params:
    project_id: Project identifier.
    type: Advisor type.
- name: get_project_url
  description: Gets a project's API URL.
  params:
    project_id: Project identifier.
- name: get_publishable_keys
  description: Gets client-safe publishable and legacy anon API keys for a project.
  params:
    project_id: Project identifier.
- name: generate_typescript_types
  description: Generates TypeScript types from a project's database schema.
  params:
    project_id: Project identifier.
- name: list_edge_functions
  description: Lists Edge Functions in a project.
  params:
    project_id: Project identifier.
- name: get_edge_function
  description: Retrieves an Edge Function's file contents.
  params:
    function_slug: Edge Function name.
    project_id: Project identifier.
- name: deploy_edge_function
  description: Deploys an Edge Function. Requires read and write access.
  params:
    entrypoint_path: Function entrypoint path.
    files: Function files.
    import_map_path: Import map path.
    name: Function name.
    project_id: Project identifier.
    verify_jwt: Require JWT verification.
- name: create_branch
  description: Creates a development branch. Requires a paid plan and read and write access.
  params:
    confirm_cost_id: Cost confirmation identifier.
    name: Branch name.
    project_id: Project identifier.
- name: list_branches
  description: Lists development branches. Requires a paid plan.
  params:
    project_id: Project identifier.
- name: delete_branch
  description: Deletes a development branch. Requires a paid plan and read and write access.
  params:
    branch_id: Branch identifier.
- name: merge_branch
  description: Merges a development branch into production. Requires a paid plan and read and write access.
  params:
    branch_id: Branch identifier.
- name: reset_branch
  description: Resets a development branch to a migration version. Requires a paid plan and read and write access.
  params:
    branch_id: Branch identifier.
    migration_version: Target migration version.
- name: rebase_branch
  description: Rebases a development branch on production. Requires a paid plan and read and write access.
  params:
    branch_id: Branch identifier.
