name: Vercel
entryKey: obot-vercel
shortDescription: Manage Vercel projects and deployments, debug logs, and query Web Analytics
description: |
  Inspect and manage Vercel projects, deployments, domains, and environment variables, debug runtime logs and errors, and search Vercel documentation with [Vercel's MCP server](https://vercel.com/docs/agent-resources/vercel-mcp).

  See the [Vercel MCP tools reference](https://vercel.com/docs/agent-resources/vercel-mcp/tools) for the full list of tools and workflow guides.

  ## Features
  - List and inspect deployments, and fetch content from protected deployment URLs you can access
  - Read runtime logs and investigate grouped runtime errors by route
  - Find and configure teams and projects, including domains, DNS, and environment variables
  - Manage firewall rules, feature flags, rolling releases, sandboxes, and storage
  - Query Web Analytics visitors, page views, and custom events
  - Search and navigate Vercel documentation

  ## What you'll need to connect

  **Required:**
  - **Vercel Account**: Each user signs in with OAuth and grants access to the Vercel teams they want to use. Tools act with that user's existing Vercel permissions, so enable human confirmation for changes to projects and deployments.
  - **Obot CLI**: Vercel requires a localhost OAuth callback. When connecting, select **Authenticate** in Obot and run the displayed `obot mcp login` command on a computer with a web browser. See [MCP localhost OAuth sign-in](https://docs.obot.ai/reference/cli-api/#mcp-localhost-oauth-sign-in).

