name: Jam
entryKey: obot-jam
serverUserType: singleUser
shortDescription: Bring Jam bug recordings, logs, and network context into coding tools
description: |
  Bring Jam recording context—including video, console logs, network requests, and user events—into an AI coding workflow to investigate and fix bugs. See [Jam's MCP guide](https://jam.dev/docs/jam-mcp) for Cursor, VS Code, Windsurf, and Claude Code setup plus OAuth connection details.

  ## Features
  - Retrieve Jam recordings and their debugging context
  - Inspect console logs, network requests, screenshots, and user events
  - Analyze recorded videos alongside development work

  ## What you'll need to connect

  A Jam account with access to the recordings you need. Jam connects through OAuth 2.0 and requests read and write scopes for its MCP tools.

