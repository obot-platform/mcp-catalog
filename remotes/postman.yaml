name: Postman
entryKey: obot-postman
serverUserType: singleUser
shortDescription: Connect to Postman collections, workspaces, environments, mocks, and API specs
upgradeNote: |
  This updates the Postman-hosted connection with OAuth support and selectable region and tool configurations.

  - **Configuration review required:** Select the US or EU region and a tool configuration when reconnecting.
  - **Authentication:** The US service now supports OAuth without an API key; the EU service still requires a Postman API key.
  - **New option:** The `code` tool configuration adds API-discovery and code-generation tools alongside `minimal` and `mcp`.
description: |
  Work with Postman workspaces, collections, APIs, and other resources through [Postman's hosted MCP server](https://www.postman.com/product/mcp-server/).

  See the [official Postman MCP documentation](https://www.postman.com/product/mcp-server/) for setup, authentication, regions, and tool sets.

  **Region:** Enter `https://mcp.postman.com` for the United States service or `https://mcp.eu.postman.com` for the Europe service.

  **Tool configuration:** Enter `minimal` for common operations, `code` for API discovery and code generation, or `mcp` for every available Postman tool.

  ## Features
  - **Collection Management**: Create, retrieve, and update Postman collections, requests, and responses
  - **Workspace and Environment Management**: Work with Postman workspaces and environments
  - **Mocks and Specifications**: Create and manage mock servers and API specifications
  - **Profile Selection**: Choose the minimal, code, or full Postman tool set
  - **Flexible Authentication**: Use OAuth when available or authenticate with a Postman API key

  ## What you'll need to connect

  Choose a region and tool configuration that fit your workflow. The US-hosted service supports MCP OAuth with Dynamic Client Registration (DCR) and PKCE, so no API key is required. You can also provide a Postman API key for US API-key authentication.

  The EU-hosted service requires a Postman API key. Enter one when selecting Europe.

  Postman's hosted MCP server gathers anonymous telemetry. Review Postman's official documentation before connecting sensitive workflows.

  > **⚠️ Upgrade notice**
  >
  > If you're upgrading this server, note that this updates the Postman-hosted connection with OAuth support and selectable region and tool configurations.
  >
  > - **Configuration review required:** Select the US or EU region and a tool configuration when reconnecting.
  > - **Authentication:** The US service now supports OAuth without an API key; the EU service still requires a Postman API key.
  > - **New option:** The `code` tool configuration adds API-discovery and code-generation tools alongside `minimal` and `mcp`.
metadata:
  categories: Developer Tools,API Development,Testing
icon: https://avatars.githubusercontent.com/u/10251060?s=48&v=4
repoURL: https://www.postman.com/product/mcp-server/

env:
  - name: Postman Region
    key: HOST_URL
    description: Enter `https://mcp.postman.com` for United States or `https://mcp.eu.postman.com` for Europe. See the entry description for details.
    required: true
    sensitive: false
    options:
      - name: United States
        value: https://mcp.postman.com
        description: OAuth recommended; API key also accepted
      - name: Europe
        value: https://mcp.eu.postman.com
        description: Requires a Postman API key
  - name: Tool Configuration
    key: TOOL_CONFIGURATION
    description: Enter `minimal`, `code`, or `mcp`. See the entry description for details.
    required: true
    sensitive: false
    options:
      - name: Minimal
        value: minimal
        description: Essential tools for common Postman operations
      - name: Code
        value: code
        description: API discovery and code-generation context tools
      - name: Full
        value: mcp
        description: All Postman tools, including advanced collaboration and administration

runtime: remote
remoteConfig:
  urlTemplate: ${HOST_URL}/${TOOL_CONFIGURATION}
  headers:
    - name: Postman API Key
      description: Optional for US OAuth; required for the Europe region
      key: Authorization
      required: false
      sensitive: true
      prefix: "Bearer "
