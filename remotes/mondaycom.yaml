name: Monday.com
entryKey: obot-monday-dot-com
serverUserType: singleUser
shortDescription: Manage monday.com boards, items, workflows, and team collaboration
upgradeNote: |
  This entry now uses monday.com's current Streamable HTTP endpoint instead of the legacy SSE endpoint.

  - **Reconnect may be required:** Existing connections may need to authenticate again after the transport upgrade.
  - **Tool changes:** monday.com updates its hosted server automatically, so available tools and parameters may change over time.
  - **Same account access:** Tool calls continue to run as the connected user and cannot exceed that user's monday.com permissions.
description: |
  Work with boards, items, updates, workspaces, documents, dashboards, and other monday.com data through [monday.com's hosted MCP server](https://developer.monday.com/api-reference/docs/integrate-with-monday-mcp).

  See monday.com's [official MCP integration guide](https://developer.monday.com/api-reference/docs/integrate-with-monday-mcp) for current setup, authentication, and tool information.

  ## Features
  - **Access monday.com data from compatible AI applications**
  - **Create and manage boards, items, and projects through natural language**
  - **Automate workflows and track progress across teams**
  - **Generate reports and insights based on monday.com data**
  - **Manage users, teams, and workspace organization**
  - **Create forms and collect data submissions**
  - **Build dashboards and visualizations**

  ## What you'll need to connect

  Ask your monday.com administrator to enable the hosted AI Connector for your account if it is not already available. Then connect with monday.com OAuth; public MCP clients use OAuth discovery and dynamic client registration automatically.

  All tool calls use your monday.com identity and respect your account, workspace, board, and app-scope permissions. Organizations that need narrower scopes or client restrictions can configure their own monday.com OAuth app. A personal API token can also be used as a bearer token when OAuth is unavailable, but it should only be used for personal development or testing.

  ## Examples
  - "Create a new board for Q2 planning with status columns"
  - "List all items with status 'Done' from the Marketing board"
  - "Add a new team member to the project and assign them tasks"
  - "Create a dashboard showing project progress across all boards"
  - "Generate a report of completed tasks this week"

  > **⚠️ Upgrade notice**
  >
  > If you're upgrading this server, note that this entry now uses monday.com's current Streamable HTTP endpoint instead of the legacy SSE endpoint.
  >
  > - **Reconnect may be required:** Existing connections may need to authenticate again after the transport upgrade.
  > - **Tool changes:** monday.com updates its hosted server automatically, so available tools and parameters may change over time.
  > - **Same account access:** Tool calls continue to run as the connected user and cannot exceed that user's monday.com permissions.

