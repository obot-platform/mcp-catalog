name: ChEMBL
entryKey: obot-chembl
serverUserType: singleUser
shortDescription: Search compounds, drugs, targets, bioactivity, mechanisms, and ADMET data
description: |
  Search curated compounds, drugs, biological targets, mechanisms, quantitative bioactivity, and ADMET properties from the ChEMBL database. See the [ChEMBL connector tutorial](https://claude.com/resources/tutorials/using-the-chembl-connector-in-claude) for usage guidance and the [ChEMBL interface documentation](https://chembl.gitbook.io/chembl-interface-documentation) for details about the underlying data.

  ## Features
  - Search compounds by name, SMILES, or ChEMBL identifier
  - Find approved drugs and clinical candidates by name or indication
  - Search proteins, genes, receptors, enzymes, and other biological targets
  - Retrieve quantitative bioactivity such as IC50, EC50, and Ki values
  - Inspect drug mechanisms, target interactions, and ADMET properties

  ## What you'll need to connect

  **No Setup Required:** The connector provides read-only public access without authentication.

