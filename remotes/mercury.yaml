name: Mercury
entryKey: obot-mercury
serverUserType: singleUser
shortDescription: Search, analyze, and understand Mercury account and transaction data
description: |
  Search, analyze, and understand Mercury balances, transactions, statements, cards, and recipients from an AI client. See [Mercury's MCP connection guide](https://docs.mercury.com/docs/connecting-mercury-mcp) for ChatGPT and Codex CLI setup, OAuth authentication, and troubleshooting.

  ## Features
  - Load account, transaction, recipient, and statement information
  - Retrieve account card details
  - Analyze Mercury financial data in a connected AI workflow

  ## What you'll need to connect

  A Mercury account with access to the financial data you want to query. Mercury uses OAuth 2.0 with dynamic client registration; access follows your account permissions.

