shortDescription: Manage recruiting, candidates, offers, and HR operations
description: |
  Manage jobs, candidates, offers, requisitions, employees, time off, and performance reviews in Workable. See the [Workable MCP Server reference](https://workable.readme.io/reference/workable-mcp-server) for setup, OAuth discovery, and available tools.

  ## Features
  - Search and manage jobs, candidates, pipelines, and offers
  - Work with requisitions, departments, members, and employees
  - Review time off, time tracking, and performance cycles

  ## What you'll need to connect
  **Required:**
  - **Workable Account**: Access follows your account roles and permissions
