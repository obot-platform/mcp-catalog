runtime: remote
remoteConfig:
  urlTemplate: https://api.githubcopilot.com/mcp${GITHUB_MCP_PATH}
  headers:
  - name: Personal Access Token
    description: GitHub PAT
    key: Authorization
    required: true
    sensitive: true
