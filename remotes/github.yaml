    description: Dependabot alerts and dependency tools.
  - name: Dependabot (read-only)
    value: /x/dependabot/readonly
    description: Read Dependabot alerts and dependency information without modifying them.
  - name: Discussions
    value: /x/discussions
    description: GitHub Discussions tools.
  - name: Discussions (read-only)
    value: /x/discussions/readonly
    description: Read GitHub Discussions without modifying them.
  - name: Gists
    value: /x/gists
    description: GitHub Gist tools.
