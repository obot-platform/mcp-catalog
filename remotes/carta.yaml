name: Carta CRM
entryKey: obot-carta
serverUserType: singleUser
shortDescription: Search and manage private-market relationships, deals, notes, tasks, reports, and campaigns
description: |
  Search and manage Carta CRM contacts, companies, deals, investor relationships, notes, tasks, reports, and campaigns from an MCP-compatible AI workflow. See the official [Carta CRM MCP documentation](https://docs.carta.com/crm/docs/carta-crm-mcp) for the endpoint, available tools, authentication, and setup.

  ## Features
  - Search, create, update, and organize CRM contacts, companies, investors, deals, fundraisings, notes, and tasks
  - Review email and calendar interactions, including your own connected mailbox history
  - Create draft email campaigns, retrieve campaign data, and manage campaign reports
  - Generate CSV and PDF exports and manage attachments on CRM entities
  - Retrieve organization users, teams, notification settings, and CRM guidance

  ## What you'll need to connect

  **Required:**
  - **Carta CRM Account**: Sign in through Carta's OAuth flow
  - **Product Access**: Your account must be entitled to the CRM data and actions you want to use

  All data and actions are restricted to the connected user's existing Carta permissions.

  **Read and write:** The connector can create, update, and delete CRM records. Review proposed changes before approving them.

