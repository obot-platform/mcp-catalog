name: Granola
entryKey: granola
serverUserType: singleUser
shortDescription: Search meeting notes, summaries, folders, and transcripts from Granola
description: |
  The official Granola Model Context Protocol (MCP) server connects your AI assistant to meeting notes in your active Granola workspace.

  ## Features
  - Search and query meeting notes, summaries, attendees, and action items
  - Browse accessible meeting folders and meetings
  - Read raw meeting transcripts on paid plans
  - Confirm the connected account and active workspace

  ## What you'll need to connect
  - A Granola account with existing meeting notes
  - Browser access to complete OAuth authentication

  Granola uses browser OAuth with Dynamic Client Registration, so no client ID or secret is required. Access follows your active Granola workspace and the permissions of your account. Basic accounts can access personal notes from the last 30 days; Business accounts can access personal and public notes; Enterprise administrators control the scopes available to members. Meeting notes and transcripts may contain sensitive information—review what your workspace shares before connecting.

metadata:
  categories: Productivity
icon: https://www.granola.ai/favicon/favicon.svg
repoURL: https://docs.granola.ai/help-center/sharing/integrations/mcp
runtime: remote
remoteConfig:
  fixedURL: https://mcp.granola.ai/mcp

